<style>
/* ── BG GLOW ── */
.cat-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.cat-bg-glow {
  position: absolute; border-radius: 50%; filter: blur(160px);
}

/* ── HERO ── */
.cat-hero {
  position: relative; z-index: 1;
  padding: 80px 48px 56px;
  max-width: 1380px; margin: 0 auto;
}
.cat-back {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  text-decoration: none; transition: color 0.2s; margin-bottom: 40px;
}
.cat-back:hover { color: var(--cyan); }
.cat-icon-lg { font-size: 56px; line-height: 1; margin-bottom: 16px; display: block; }
.cat-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(60px, 9vw, 110px);
  line-height: 0.9; letter-spacing: 2px; margin-bottom: 16px;
}
.cat-title-cyan   { background: linear-gradient(135deg, var(--cyan)   0%, rgba(0,229,255,0.6)  100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.cat-title-pink   { background: linear-gradient(135deg, var(--pink)   0%, rgba(255,45,120,0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.cat-title-purple { background: linear-gradient(135deg, var(--purple) 0%, rgba(182,77,255,0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.cat-title-green  { background: linear-gradient(135deg, var(--green)  0%, rgba(61,255,133,0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.cat-title-amber  { background: linear-gradient(135deg, var(--amber)  0%, rgba(255,184,0,0.6)  100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.cat-desc-text {
  font-size: 16px; color: var(--muted); max-width: 560px;
  line-height: 1.6; margin-bottom: 24px;
}
.cat-count-badge {
  display: inline-block;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; padding: 6px 16px;
  border: 1px solid var(--border); color: var(--muted);
  background: rgba(255,255,255,0.03);
}

/* ── CONTROLS (sticky) ── */
.cat-controls {
  position: sticky; top: 0; z-index: 10;
  background: rgba(6,6,12,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 48px;
}
.cat-controls-inner {
  max-width: 1380px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
}
.cat-search {
  flex: 1; max-width: 440px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--white); font-family: 'Chakra Petch', sans-serif; font-size: 14px;
  padding: 10px 16px; outline: none; transition: border-color 0.2s;
}
.cat-search::placeholder { color: var(--muted); }
.cat-search:focus { border-color: var(--cyan); }
.cat-result-count {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase; white-space: nowrap;
}

/* ── BRAND GRID ── */
.cat-content {
  max-width: 1380px; margin: 0 auto;
  padding: 40px 48px 80px;
  position: relative; z-index: 1;
}
.cat-brand-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

/* ── EMPTY STATE ── */
.empty-cat {
  grid-column: 1 / -1;
  text-align: center; padding: 64px 24px;
  color: var(--muted); font-size: 15px;
}
.empty-cat-icon { font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.4; }

/* ── COMING SOON ── */
.cat-coming-soon {
  max-width: 1380px; margin: 0 auto;
  padding: 60px 48px 80px;
  text-align: center; position: relative; z-index: 1;
}
.cat-coming-soon-icon { font-size: 64px; display: block; margin-bottom: 24px; opacity: 0.5; }
.cat-coming-soon-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 64px;
  letter-spacing: 4px; color: var(--muted); margin-bottom: 16px;
}
.cat-coming-soon-text {
  color: var(--muted); font-size: 15px;
  max-width: 420px; margin: 0 auto; line-height: 1.6;
}

/* ── OTHER CATEGORIES ── */
.other-cats {
  max-width: 1380px; margin: 0 auto;
  padding: 0 48px 80px;
  position: relative; z-index: 1;
}
.other-cats-label {
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
}
.other-cats-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.other-cat-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Chakra Petch', sans-serif; font-size: 12px;
  padding: 7px 14px; border: 1px solid var(--border);
  color: var(--muted); text-decoration: none;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.2s, color 0.2s;
}
.other-cat-pill:hover { border-color: var(--cyan); color: var(--white); }
.other-cat-pill-icon { font-size: 14px; }
.other-cat-pill-count {
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--muted); margin-left: 2px;
}

/* ── FILTER RAIL ── */
.cat-layout {
  display: grid; grid-template-columns: 232px minmax(0, 1fr);
  gap: 44px; align-items: start;
}
.cat-layout.no-rail { grid-template-columns: 1fr; }
.cat-layout.no-rail .cat-rail { display: none; }
.cat-rail { position: sticky; top: 88px; }
.cat-rail-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid var(--border-hi);
}
.cat-rail-title {
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--muted);
}
.cat-rail-clear {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--cyan);
}
.cat-rail-clear:hover { text-decoration: underline; }
.fgroup { border-bottom: 1px solid var(--border); }
.fgroup-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; cursor: pointer; list-style: none;
  font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--white);
}
.fgroup-head::-webkit-details-marker { display: none; }
.fgroup-caret {
  font-size: 11px; color: var(--faint);
  transition: transform 0.2s;
}
.fgroup[open] .fgroup-caret { transform: rotate(180deg); }
.fgroup-opts { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 16px; }
.fgroup-opts-scroll { max-height: 236px; overflow-y: auto; padding-right: 6px; }
.fopt {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  font-family: 'Chakra Petch', sans-serif; font-size: 13px; color: var(--muted);
  transition: color 0.15s;
}
.fopt:hover { color: var(--white); }
.fopt input {
  appearance: none; -webkit-appearance: none;
  width: 15px; height: 15px; flex: 0 0 15px; margin: 0;
  border: 1px solid var(--border-hi); background: var(--surface);
  cursor: pointer; position: relative;
  transition: border-color 0.15s, background 0.15s;
}
.fopt input:hover { border-color: var(--cyan); }
.fopt input:checked { background: var(--cyan); border-color: var(--cyan); }
.fopt input:checked::after {
  content: ''; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid var(--black); border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.fopt input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.fopt input:checked ~ .fopt-label { color: var(--white); }
.fopt-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fopt-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--faint); }
.cat-filter-toggle {
  display: none; align-items: center; justify-content: center; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; padding: 10px 16px; cursor: pointer;
  border: 1px solid var(--border-hi); background: var(--surface); color: var(--white);
}
.cat-ft-caret { font-size: 10px; color: var(--faint); transition: transform 0.2s; }
.cat-filter-toggle.open .cat-ft-caret { transform: rotate(180deg); }
.fclear-inline {
  display: inline-block; margin-top: 18px; padding: 9px 20px; cursor: pointer;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; background: none;
  border: 1px solid var(--cyan); color: var(--cyan);
  transition: background 0.15s;
}
.fclear-inline:hover { background: rgba(0,229,255,0.08); }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .cat-hero    { padding: 64px 20px 48px; }
  .cat-controls { padding: 12px 20px; }
  .cat-content  { padding: 28px 20px 60px; }
  .other-cats   { padding: 0 20px 60px; }
  .cat-brand-grid { grid-template-columns: 1fr; }
  .cat-controls-inner { flex-direction: column; align-items: stretch; }
  .cat-search { max-width: 100%; }
  .cat-layout { display: block; }
  .cat-rail {
    position: static; display: none;
    border: 1px solid var(--border); background: rgba(255,255,255,0.02);
    padding: 4px 16px 16px; margin-bottom: 24px;
  }
  .cat-rail.open { display: block; }
  .cat-rail-head { padding-top: 12px; }
  .cat-filter-toggle { display: flex; }
  .cat-layout.no-rail .cat-filter-toggle { display: none; }
}
</style>

<script src="js/data.js" defer></script>
<script>
/* data.js is deferred, so BRANDS/CATEGORIES aren't defined at parse time —
   run everything once the DOM (and all deferred scripts) are ready. */
document.addEventListener('DOMContentLoaded', function () {
  /* ── DATA (from window.PLURGASM_DATA, set by data.js) ── */
  const DATA_BRANDS = (window.PLURGASM_DATA && PLURGASM_DATA.brands)     || [];
  const DATA_CATS   = (window.PLURGASM_DATA && PLURGASM_DATA.categories) || [];

  /* ── MERGE ADMIN BRANDS ── */
  try {
    const extra = JSON.parse(localStorage.getItem('pg_admin_brands') || '[]');
    if (extra.length) DATA_BRANDS.push(...extra);
  } catch (e) {}

  /* ── NORMALIZE BRAND IDS (original 20 brands lack id field) ── */
  DATA_BRANDS.forEach(b => {
    if (!b.id) b.id = b.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  });

  /* ── PER-CATEGORY META ── */
  const CAT_DESCRIPTIONS = {
    'fem-clothing':  'Bodysuits, sets, spandex, sequin, babydoll — rave fashion for the dance floor.',
    'male-clothing': 'Shorts, shirts, unisex and custom pieces for every raver.',
    'shoes':         'Platform boots, chunky trainers, and statement shoes that survive the festival floor.',
    'accessories':   'Pasties, hair clips, body jewels, pashminas — the finishing touch to any rave look.',
    'kandi':         'Beads, perlers, premade kandi — PLUR in bracelet form.',
    'jerseys':       'Rave jerseys and merch celebrating the culture.',
    'events':        'Event promoters and communities bringing the underground above ground.',
    'supplements':   'Pre-event prep, recovery, and wellness essentials.',
    'gear':          'Audio gear, fanny packs, and festival essentials.',
    'lights':        'LED gloves, poi, light toys, and glow-up gear.',
    'wellness':      'Self-care, harm reduction, and festival recovery.',
  };

  const CAT_GLOWS = {
    'fem-clothing':  ['rgba(255,45,120,0.10)',  'rgba(182,77,255,0.07)'],
    'male-clothing': ['rgba(0,229,255,0.09)',   'rgba(61,255,133,0.05)'],
    'shoes':         ['rgba(182,77,255,0.10)',  'rgba(0,229,255,0.06)'],
    'accessories':   ['rgba(255,184,0,0.09)',   'rgba(255,45,120,0.05)'],
    'kandi':         ['rgba(61,255,133,0.10)',  'rgba(0,229,255,0.06)'],
    'jerseys':       ['rgba(0,229,255,0.09)',   'rgba(61,255,133,0.06)'],
    'events':        ['rgba(255,45,120,0.09)',  'rgba(255,184,0,0.05)'],
    'supplements':   ['rgba(182,77,255,0.08)',  'rgba(0,229,255,0.05)'],
    'gear':          ['rgba(0,229,255,0.09)',   'rgba(182,77,255,0.05)'],
    'lights':        ['rgba(255,184,0,0.10)',   'rgba(61,255,133,0.06)'],
    'wellness':      ['rgba(61,255,133,0.09)',  'rgba(0,229,255,0.05)'],
  };

  const CAT_TITLE_CLS = {
    'fem-clothing':  'cat-title-pink',
    'male-clothing': 'cat-title-cyan',
    'shoes':         'cat-title-purple',
    'accessories':   'cat-title-amber',
    'kandi':         'cat-title-green',
    'jerseys':       'cat-title-cyan',
    'events':        'cat-title-pink',
    'supplements':   'cat-title-purple',
    'gear':          'cat-title-cyan',
    'lights':        'cat-title-amber',
    'wellness':      'cat-title-green',
  };

  /* ── BRAND MODAL ── */
  function priceChipClass(p) {
    if (!p) return 'chip-neutral';
    if (p.startsWith('$$$$') || p.startsWith('$$$–')) return 'chip-priceLux';
    if (p.startsWith('$$$') || p.startsWith('$$–$$$'))  return 'chip-priceHi';
    if (p.startsWith('$$')  || p.startsWith('$–$$'))    return 'chip-priceMid';
    if (p === '$') return 'chip-price';
    return 'chip-neutral';
  }

  window.openBrandModal = function (id) {
    const b = DATA_BRANDS.find(x => x.id === id);
    if (!b) return;
    const igHandle = b.ig ? b.ig.replace(/^@/, '') : null;
    const hasUrl   = b.url && b.url !== '#';
    const catLabel = (DATA_CATS.find(c => c.id === b.cat) || {}).label || b.cat;

    document.getElementById('brand-modal-content').innerHTML = `
      <div class="bm-header">
        <div class="bm-badge ${b.badgeCls}">${b.badge}</div>
        <div class="bm-title-group">
          <p class="bm-name">${b.name}</p>
          <p class="bm-cat">${catLabel} &nbsp;·&nbsp; ${b.loc}</p>
        </div>
      </div>
      <div class="bm-chips">
        <span class="bm-chip ${priceChipClass(b.price)}"><span class="bm-chip-icon">💰</span>${b.price || 'Price varies'}</span>
        ${b.ship ? `<span class="bm-chip chip-neutral"><span class="bm-chip-icon">⏱</span>${b.ship}</span>` : ''}
        ${b.loc  ? `<span class="bm-chip chip-neutral"><span class="bm-chip-icon"><img src="images/icons/icon-pin.webp" class="icon-pin-inline" alt="location"></span>${b.loc}</span>` : ''}
        ${b.ig   ? `<span class="bm-chip chip-neutral"><span class="bm-chip-icon">📱</span>${b.ig}</span>` : ''}
      </div>
      <div class="bm-body">
        <div>
          <p class="bm-section-label">About</p>
          <p class="bm-desc">${b.desc}</p>
        </div>
        <div>
          <p class="bm-section-label">What They Sell</p>
          <p class="bm-style-text">${b.style}</p>
        </div>
        ${b.note ? `<div><p class="bm-section-label">Community Notes</p><div class="bm-note">${b.note}</div></div>` : ''}
        ${b.tags && b.tags.length ? `<div><p class="bm-section-label">Tags</p><div class="bm-tags">${b.tags.map(t => `<span class="bm-tag">${t}</span>`).join('')}</div></div>` : ''}
      </div>
      <div class="bm-links">
        ${hasUrl
          ? `<a href="${b.url}" target="_blank" rel="noopener" class="bm-link-btn bm-link-primary">Visit Website →</a>`
          : `<span class="bm-link-btn bm-link-ghost" style="cursor:default;opacity:0.5;">No website listed</span>`}
        ${igHandle ? `<a href="https://instagram.com/${igHandle}" target="_blank" rel="noopener" class="brand-ig-btn">@${igHandle}</a>` : ''}
        <button onclick="closeBrandModal()" class="bm-link-btn bm-link-ghost" style="margin-left:auto;">Close</button>
      </div>
    `;

    const scrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = '100%';
    document.getElementById('brand-modal').classList.add('open');
  };

  window.closeBrandModal = function () {
    const scrollY = document.body.style.top;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, parseInt(scrollY || '0') * -1);
    document.getElementById('brand-modal').classList.remove('open');
  };

  document.addEventListener('click', e => {
    if (e.target === document.getElementById('brand-modal')) closeBrandModal();
  });

  /* ── MOBILE MENU ── */
  window.toggleMobileMenu = function () {
    const menu = document.getElementById('mobile-menu');
    const btn  = document.getElementById('hamburger');
    const opening = !menu.classList.contains('open');
    menu.classList.toggle('open', opening);
    btn.classList.toggle('open', opening);
    btn.setAttribute('aria-expanded', opening);
    document.body.style.overflow = opening ? 'hidden' : '';
  };

  window.closeMobileMenu = function () {
    const menu = document.getElementById('mobile-menu');
    const btn  = document.getElementById('hamburger');
    menu.classList.remove('open');
    btn.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMobileMenu(); closeBrandModal(); }
  });

  /* ── SELF-REFERENCING CANONICAL + META ──
     Extensionless form (matches sitemap.xml). Wrapped so a throw here can't kill render. */
  function setCanonical(url) {
    try {
      let l = document.getElementById('canonical-link') || document.querySelector('link[rel="canonical"]');
      if (!l) { l = document.createElement('link'); l.setAttribute('rel', 'canonical'); document.head.appendChild(l); }
      l.setAttribute('href', url);
      let og = document.querySelector('meta[property="og:url"]');
      if (!og) { og = document.createElement('meta'); og.setAttribute('property', 'og:url'); document.head.appendChild(og); }
      og.setAttribute('content', url);
    } catch (e) { console.error('canonical/og:url error:', e); }
  }
  function clampDesc(txt) {
    txt = (txt || '').replace(/\s+/g, ' ').trim();
    if (txt.length > 160) {
      txt = txt.slice(0, 160);
      const sp = txt.lastIndexOf(' ');
      if (sp > 120) txt = txt.slice(0, sp);
      txt = txt.replace(/[\s.,;:!?-]+$/, '') + '…';
    }
    return txt;
  }
  function setMetaDesc(txt) {
    let m = document.querySelector('meta[name="description"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute('name', 'description'); document.head.appendChild(m); }
    m.setAttribute('content', clampDesc(txt));
  }

  /* ── RENDER ── */
  let searchQuery = '';
  let currentCatId = '';

  /* ── FACETED FILTERS ──
     Groups built from the data actually present in this category.
     Within a group checks are OR; across groups AND. */
  const activeFilters = { price: new Set(), tag: new Set(), loc: new Set() };
  let facetGroups = [];

  const PRICE_LABELS = { 1: '$', 2: '$$', 3: '$$$', 4: '$$$$' };

  /* '$–$$$' covers levels 1..3; 'Varies' covers none */
  function parsePriceLevels(p) {
    const runs = (p || '').match(/\$+/g);
    if (!runs || !runs.length) return [];
    const lens = runs.map(r => Math.min(r.length, 4));
    const min = Math.min(...lens), max = Math.max(...lens);
    const out = [];
    for (let l = min; l <= max; l++) out.push(String(l));
    return out;
  }

  function brandFacetValues(b, key) {
    if (key === 'price') return parsePriceLevels(b.price);
    if (key === 'tag')   return b.tags || [];
    if (key === 'loc')   return b.loc ? [b.loc] : [];
    return [];
  }

  function buildFacets(list) {
    const groups = [];

    const priceCounts = {};
    list.forEach(b => parsePriceLevels(b.price).forEach(l => { priceCounts[l] = (priceCounts[l] || 0) + 1; }));
    const priceOpts = Object.keys(priceCounts).sort()
      .map(l => ({ value: l, label: PRICE_LABELS[l] || l, count: priceCounts[l] }));
    if (priceOpts.length >= 2) groups.push({ key: 'price', label: 'Price', options: priceOpts });

    const tagCounts = {};
    list.forEach(b => new Set(b.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
    const tagOpts = Object.keys(tagCounts)
      .filter(t => tagCounts[t] < list.length) /* a tag on every brand can't narrow anything */
      .sort((a, b) => tagCounts[b] - tagCounts[a] || a.localeCompare(b))
      .map(t => ({ value: t, label: t, count: tagCounts[t] }));
    if (tagOpts.length >= 2) groups.push({ key: 'tag', label: 'Tags', options: tagOpts, scroll: tagOpts.length > 9 });

    const locCounts = {};
    list.forEach(b => { if (b.loc) locCounts[b.loc] = (locCounts[b.loc] || 0) + 1; });
    const locVals = Object.keys(locCounts);
    const topShare = list.length ? Math.max(0, ...locVals.map(l => locCounts[l])) / list.length : 1;
    if (locVals.length >= 2 && topShare <= 0.85) { /* skip when nearly all share one value */
      groups.push({
        key: 'loc', label: 'Location',
        options: locVals.sort((a, b) => locCounts[b] - locCounts[a] || a.localeCompare(b))
          .map(l => ({ value: l, label: l, count: locCounts[l] })),
      });
    }
    return groups;
  }

  function matchesFilters(b) {
    return Object.keys(activeFilters).every(key => {
      const set = activeFilters[key];
      if (!set.size) return true;
      return brandFacetValues(b, key).some(v => set.has(v));
    });
  }

  function hasActiveFilters() {
    return Object.keys(activeFilters).some(k => activeFilters[k].size > 0);
  }

  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function renderFilterRail(baseList) {
    const rail   = document.getElementById('cat-rail');
    const wrap   = document.getElementById('cat-filter-groups');
    const layout = document.getElementById('cat-layout');
    const toggle = document.getElementById('cat-filter-toggle');
    if (!rail || !wrap) return;
    try {
      facetGroups = buildFacets(baseList);
    } catch (err) {
      console.error('buildFacets failed:', err);
      facetGroups = [];
    }
    if (!facetGroups.length) {
      if (layout) layout.classList.add('no-rail');
      if (toggle) toggle.style.display = 'none';
      return;
    }
    wrap.innerHTML = facetGroups.map(g => `
      <details class="fgroup" open>
        <summary class="fgroup-head">${g.label}<span class="fgroup-caret">▾</span></summary>
        <div class="fgroup-opts${g.scroll ? ' fgroup-opts-scroll' : ''}">
          ${g.options.map(o => `
            <label class="fopt">
              <input type="checkbox" data-group="${g.key}" value="${escAttr(o.value)}">
              <span class="fopt-label">${escAttr(o.label)}</span>
              <span class="fopt-count">${o.count}</span>
            </label>`).join('')}
        </div>
      </details>`).join('');
    wrap.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', onFilterChange);
    });
  }

  function onFilterChange() {
    try {
      Object.keys(activeFilters).forEach(k => activeFilters[k].clear());
      document.querySelectorAll('#cat-filter-groups input:checked').forEach(cb => {
        const g = cb.getAttribute('data-group');
        if (activeFilters[g]) activeFilters[g].add(cb.value);
      });
      updateFilterMeta();
      renderGrid(currentCatId);
    } catch (err) {
      console.error('onFilterChange failed:', err);
    }
  }

  window.clearCatFilters = function () {
    try {
      Object.keys(activeFilters).forEach(k => activeFilters[k].clear());
      document.querySelectorAll('#cat-filter-groups input:checked').forEach(cb => { cb.checked = false; });
      updateFilterMeta();
      renderGrid(currentCatId);
    } catch (err) {
      console.error('clearCatFilters failed:', err);
    }
  };

  function updateFilterMeta() {
    let n = 0;
    Object.keys(activeFilters).forEach(k => { n += activeFilters[k].size; });
    const clearBtn = document.getElementById('cat-clear-filters');
    if (clearBtn) clearBtn.hidden = n === 0;
    const ftCount = document.getElementById('cat-ft-count');
    if (ftCount) ftCount.textContent = n ? '· ' + n : '';
  }

  function renderBrandCard(b) {
    return `
      <div class="brand-card" onclick="openBrandModal('${b.id}')">
        <div class="brand-badge ${b.badgeCls}">${b.badge}</div>
        <div class="brand-info">
          <p class="brand-name">${b.name}</p>
          <div class="brand-meta">
            <span class="brand-price ${b.priceCls}">${b.price}</span>
            <span class="brand-ship">⏱ ${b.ship}</span>
            <span class="brand-loc"><img src="images/icons/icon-pin.webp" class="icon-pin-inline" alt="location"> ${b.loc}</span>
          </div>
          <p class="brand-style">${b.style}</p>
          <p class="brand-desc">${b.desc}</p>
          ${b.ig ? `<a class="brand-ig-btn" href="https://instagram.com/${b.ig.replace('@', '')}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${b.ig}</a>` : ''}
        </div>
      </div>
    `;
  }

  function renderGrid(catId) {
    const base = DATA_BRANDS.filter(b => b.cat === catId);
    let list = base;
    try {
      list = list.filter(matchesFilters);
    } catch (err) {
      console.error('facet filtering failed:', err);
    }
    if (searchQuery) {
      list = list.filter(b =>
        [b.name, b.cat, b.style, b.loc, b.desc, b.ig, ...(b.tags || [])].join(' ').toLowerCase().includes(searchQuery)
      );
    }

    const grid    = document.getElementById('cat-brand-grid');
    const countEl = document.getElementById('cat-result-count');
    if (!grid) return;

    if (!list.length) {
      grid.innerHTML = hasActiveFilters() ? `
        <div class="empty-cat">
          <span class="empty-cat-icon">🔍</span>
          No brands match these filters — try clearing one.<br>
          <button type="button" class="fclear-inline" onclick="clearCatFilters()">Clear all filters</button>
        </div>` : `
        <div class="empty-cat">
          <span class="empty-cat-icon">🔍</span>
          ${searchQuery ? `No brands match "<strong>${searchQuery}</strong>"` : 'No brands listed in this category yet.'}
        </div>`;
      if (countEl) countEl.textContent = 'Showing 0 of ' + base.length;
      return;
    }

    grid.innerHTML = list.map(renderBrandCard).join('');
    if (countEl) countEl.textContent = list.length === base.length
      ? base.length + ' brand' + (base.length !== 1 ? 's' : '')
      : 'Showing ' + list.length + ' of ' + base.length;
  }

  function renderPage() {
    const params  = new URLSearchParams(window.location.search);
    const catId   = params.get('cat') || '';
    const cat     = DATA_CATS.find(c => c.id === catId);
    const page    = document.getElementById('cat-page');
    currentCatId  = catId;

    if (!cat) {
      setCanonical('https://plurgasm.com/category');
      page.innerHTML = `
        <div class="cat-hero">
          <a href="/" class="cat-back">← Back to PLURGASM</a>
          <p style="color:var(--muted);font-size:16px;">Category not found. <a href="/" style="color:var(--cyan);">Browse all →</a></p>
        </div>`;
      return;
    }

    document.title = `${cat.label} Brands — PLURGASM`;
    setCanonical('https://plurgasm.com/category?cat=' + catId);
    setMetaDesc((CAT_DESCRIPTIONS[catId] || ('Browse ' + cat.label + ' rave brands.')) + ' — on PLURGASM, the rave universe.');

    const glows    = CAT_GLOWS[catId]     || ['rgba(0,229,255,0.08)', 'rgba(182,77,255,0.05)'];
    const titleCls = CAT_TITLE_CLS[catId] || 'cat-title-cyan';
    const desc     = CAT_DESCRIPTIONS[catId] || '';
    const count    = DATA_BRANDS.filter(b => b.cat === catId).length;
    const isComing = !!(cat.comingSoon || count === 0);
    const isImage  = cat.icon && /\.(png|jpg|svg|webp)$/i.test(cat.icon);
    const iconHtml = isImage
      ? `<img src="${cat.icon}" width="64" height="64" style="width:64px;height:64px;object-fit:contain;mix-blend-mode:screen;" alt="${cat.label}">`
      : cat.icon;

    /* set bg glow */
    document.getElementById('cat-bg').innerHTML = `
      <div class="cat-bg-glow" style="width:600px;height:600px;background:${glows[0]};top:-200px;left:-100px;"></div>
      <div class="cat-bg-glow" style="width:500px;height:500px;background:${glows[1]};top:80px;right:-150px;"></div>
    `;

    /* hero */
    const heroHtml = `
      <div class="cat-hero">
        <a href="/" class="cat-back">← All Categories</a>
        <span class="cat-icon-lg">${iconHtml}</span>
        <h1 class="cat-title ${titleCls}">${cat.label.toUpperCase()}</h1>
        <p class="cat-desc-text">${desc}</p>
        <span class="cat-count-badge">${isComing ? 'Coming Soon' : count + ' Brand' + (count !== 1 ? 's' : '') + ' in this category'}</span>
      </div>
    `;

    /* other categories strip (exclude current, exclude coming-soon) */
    const others = DATA_CATS.filter(c => c.id !== catId && c.count > 0);
    const othersHtml = others.length ? `
      <div class="other-cats">
        <p class="other-cats-label">More Categories</p>
        <div class="other-cats-pills">
          ${others.map(c => `
            <a class="other-cat-pill" href="/category?cat=${c.id}">
              <span class="other-cat-pill-icon">${c.icon}</span>
              ${c.label}
              <span class="other-cat-pill-count">${c.count}</span>
            </a>
          `).join('')}
        </div>
      </div>
    ` : '';

    if (isComing) {
      page.innerHTML = heroHtml + `
        <div class="cat-coming-soon">
          <span class="cat-coming-soon-icon">${cat.icon}</span>
          <p class="cat-coming-soon-title">COMING SOON</p>
          <p class="cat-coming-soon-text">We're curating the best ${cat.label.toLowerCase()} brands for the community. Check back soon.</p>
        </div>
      ` + othersHtml;
      return;
    }

    page.innerHTML = heroHtml + `
      <div class="cat-controls">
        <div class="cat-controls-inner">
          <input type="text" class="cat-search" id="cat-search"
            placeholder="Search ${cat.label.toLowerCase()} brands…"
            aria-label="Search ${cat.label.toLowerCase()} brands" autocomplete="off">
          <button type="button" class="cat-filter-toggle" id="cat-filter-toggle"
            aria-expanded="false" aria-controls="cat-rail">
            <span>Filters</span><span id="cat-ft-count"></span><span class="cat-ft-caret">▾</span>
          </button>
          <span class="cat-result-count" id="cat-result-count"></span>
        </div>
      </div>
      <div class="cat-content">
        <div class="cat-layout" id="cat-layout">
          <aside class="cat-rail" id="cat-rail" aria-label="Filter ${cat.label.toLowerCase()} brands">
            <div class="cat-rail-head">
              <span class="cat-rail-title">Filter</span>
              <button type="button" class="cat-rail-clear" id="cat-clear-filters" hidden
                onclick="clearCatFilters()">Clear all</button>
            </div>
            <div id="cat-filter-groups"></div>
          </aside>
          <div class="cat-results">
            <div class="cat-brand-grid" id="cat-brand-grid"></div>
          </div>
        </div>
      </div>
    ` + othersHtml;

    try {
      renderFilterRail(DATA_BRANDS.filter(b => b.cat === catId));
    } catch (err) {
      console.error('renderFilterRail failed:', err);
    }
    renderGrid(catId);

    document.getElementById('cat-search').addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderGrid(catId);
    });

    const ftBtn = document.getElementById('cat-filter-toggle');
    if (ftBtn) ftBtn.addEventListener('click', () => {
      const rail = document.getElementById('cat-rail');
      if (!rail) return;
      const opening = !rail.classList.contains('open');
      rail.classList.toggle('open', opening);
      ftBtn.classList.toggle('open', opening);
      ftBtn.setAttribute('aria-expanded', String(opening));
    });
  }

  renderPage();
});
</script>

<div id="site-bottom-nav"></div>
</body>
</html>
