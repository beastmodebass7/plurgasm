<!-- Private personal page — keep it out of search results (and the sitemap, like /admin). -->

<title>Your Profile — PLURGASM</title>

<style>
/* ─────── PROFILE PAGE ─────── */
.pf-wrap { max-width: 1180px; margin: 0 auto; padding: 110px 32px 90px; }

/* loading + signed-out */
.pf-loading-screen,
.pf-signin {
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
}
.pf-loading-screen p {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.pf-signin-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 6vw, 58px);
  letter-spacing: 3px;
  color: var(--white);
  line-height: 1;
}
.pf-signin-sub {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 420px;
  margin-top: -6px;
}

/* header */
.pf-header {
  display: flex;
  align-items: center;
  gap: 22px;
  padding-bottom: 28px;
  margin-bottom: 34px;
  border-bottom: 1px solid var(--border);
}
.pf-avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(0,229,255,0.4);
  box-shadow: 0 0 0 4px rgba(0,229,255,0.06);
  flex: 0 0 auto;
}
.pf-avatar-default {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(240,238,255,0.06);
  color: rgba(240,238,255,0.5);
}
.pf-avatar-default svg { width: 40px; height: 40px; display: block; }
.pf-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 4.6vw, 46px);
  letter-spacing: 2px;
  color: var(--white);
  line-height: 1;
  margin-bottom: 8px;
}
.pf-email {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.5px;
  color: var(--muted);
  word-break: break-all;
}

/* layout: sidebar + content */
.pf-layout {
  display: grid;
  grid-template-columns: 244px 1fr;
  gap: 36px;
  align-items: start;
}
.pf-sidebar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 100px;
}
.pf-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  background: transparent;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  color: var(--muted);
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.pf-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--white); }
.pf-nav-item.active {
  background: rgba(0,229,255,0.06);
  border-color: rgba(0,229,255,0.22);
  border-left-color: var(--cyan);
  color: var(--white);
}
.pf-nav-icon { font-size: 16px; line-height: 1; }

/* content sections */
.pf-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 2px;
  color: var(--white);
  margin-bottom: 6px;
}
.pf-section-sub {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
}
.pf-fest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}
.pf-loading {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--muted);
  grid-column: 1 / -1;
  padding: 24px 0;
}

/* empty state */
.pf-empty {
  text-align: center;
  padding: 64px 24px;
  border: 1px dashed var(--border);
  background: rgba(255,255,255,0.015);
}
.pf-empty-emoji { font-size: 40px; margin-bottom: 14px; }
.pf-empty-text {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 380px;
  margin: 0 auto 20px;
}
.pf-empty-cta {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--cyan);
  border: 1px solid rgba(0,229,255,0.3);
  padding: 10px 18px;
  text-decoration: none;
  display: inline-block;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
}
.pf-empty-cta:hover { color: #06060c; background: var(--cyan); border-color: var(--cyan); }

.pf-placeholder {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 520px;
}

@media (max-width: 820px) {
  .pf-wrap { padding: 96px 18px 80px; }
  .pf-layout { grid-template-columns: 1fr; gap: 24px; }
  .pf-sidebar {
    position: static;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pf-nav-item {
    width: auto;
    border-left: none;
    border: 1px solid transparent;
  }
  .pf-nav-item.active { border-color: rgba(0,229,255,0.25); border-left: none; }
}
@media (max-width: 480px) {
  .pf-fest-grid { grid-template-columns: 1fr; }
  .pf-header { gap: 16px; }
  .pf-avatar { width: 64px; height: 64px; }
  .pf-avatar-default svg { width: 30px; height: 30px; }
}
</style>
</head>
<body>

    </div>

<div id="site-bottom-nav"></div>

<script src="js/data.js"></script>
<script>
/* ════════════════════════════════════════════════
   PROFILE PAGE
   Logged out  → "Sign in to view your profile" + Google button.
   Logged in   → header (avatar/name/email) + sidebar + active section.
   "Rave Calendar" (default) shows the user's saved UPCOMING festivals as
   festival cards, read from Supabase (RLS scopes to their own rows).
   Every Supabase call is wrapped in try/catch w/ console.error so a hiccup
   never blanks the page.
════════════════════════════════════════════════ */
(function () {
  'use strict';

  var TODAY = new Date().toISOString().slice(0, 10);
  function isPast(f) { return (f.endDate || f.sortDate) < TODAY; }

  var _session = null;
  var _activeSection = 'rave-calendar';

  var SECTIONS = [
    { id: 'rave-calendar', label: 'Rave Calendar', icon: '🗓' },
    { id: 'account',       label: 'Account',       icon: '⚙' }
  ];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var GOOGLE_G_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">' +
      '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
      '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
      '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
      '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
    '</svg>';

  var PERSON_SVG =
    '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" focusable="false">' +
      '<path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.42 0-8 2.69-8 6v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-3.31-3.58-6-8-6z"/>' +
    '</svg>';

  /* ── festival card (mirrors renderFestivals() in main.js) ── */
  var typeClass = { mega: 't-mega', underground: 't-under', regional: 't-reg', playa: 't-playa', international: 't-intl' };

  function getDaysBadge(sortDate) {
    if (!sortDate) return '';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var fest = new Date(sortDate); fest.setHours(0, 0, 0, 0);
    var diff = Math.round((fest - today) / 86400000);
    if (diff < 0)   return '<span class="fest-days-badge days-past">Past</span>';
    if (diff === 0) return '<span class="fest-days-badge days-soon">Today</span>';
    if (diff <= 14) return '<span class="fest-days-badge days-soon">' + diff + ' days away</span>';
    if (diff <= 60) return '<span class="fest-days-badge days-upcoming">' + diff + ' days away</span>';
    return '<span class="fest-days-badge days-far">' + diff + ' days</span>';
  }

  function googleCalUrl(f) {
    try {
      var start = f.sortDate.replace(/-/g, '');
      var end = new Date(f.endDate + 'T00:00:00Z');
      end.setUTCDate(end.getUTCDate() + 1);
      var endStr = end.toISOString().slice(0, 10).replace(/-/g, '');
      var text = encodeURIComponent(f.name);
      var loc = encodeURIComponent(f.location || '');
      var lineup = (f.headliners && f.headliners.length) ? 'Lineup: ' + f.headliners.join(', ') + '\n\n' : '';
      var details = encodeURIComponent(lineup + (f.desc || '') + (f.url ? '\n\nTickets: ' + f.url : ''));
      return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + text +
             '&dates=' + start + '/' + endStr + '&details=' + details + '&location=' + loc;
    } catch (e) { return null; }
  }

  function festDetailHref(f) {
    if (!f.detailPage) return f.url;
    return '/' + f.detailPage.replace(/^\/+/, '').replace(/\.html$/, '');
  }

  function festCardHTML(f) {
    var dest = festDetailHref(f);
    var target = f.detailPage ? '_self' : '_blank';
    var t = f.cardTheme;
    var cardStyle = t ? 'style="background:' + t.bg + ';border-color:' + t.border + ';"' : '';
    var glowStyle = t ? 'style="background:radial-gradient(ellipse 80% 40% at 50% 0%, ' + t.glow + ', transparent);"' : '';
    var taglineColor = t ? 'style="color:' + t.label + ';"' : '';
    var cal = googleCalUrl(f);
    return '' +
      '<div class="fest-card ' + (f.featured && !t ? 'fest-featured' : '') + '" data-id="' + f.id + '" ' + cardStyle +
        ' onclick="window.open(\'' + dest + '\',\'' + target + '\')">' +
        getDaysBadge(f.sortDate) +
        '<div class="fest-card-glow" ' + glowStyle + '></div>' +
        '<span class="fest-tag ' + (typeClass[f.type] || 't-reg') + '">' + f.typeLabel + '</span>' +
        '<p class="fest-name">' + f.name + '</p>' +
        (f.tagline ? '<p class="fest-tagline" ' + taglineColor + '>' + f.tagline + '</p>' : '') +
        '<p class="fest-meta">' + f.location + ' &nbsp;·&nbsp; ' + f.dates + ' &nbsp;·&nbsp; ' +
          f.days + ' Day' + (f.days > 1 ? 's' : '') + ' &nbsp;·&nbsp; ' + f.age + '</p>' +
        '<p class="fest-desc">' + f.desc + '</p>' +
        '<div class="fest-footer">' +
          '<div class="vibes">' + (f.genres || []).slice(0, 4).map(function (g) { return '<span class="vibe">' + g + '</span>'; }).join('') + '</div>' +
          (cal ? '<a class="add-cal" href="' + cal + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">+ Google Calendar</a>' : '') +
          (window.PlurSaves ? PlurSaves.buttonHtml(f.id) : '') +
          '<span class="fest-arrow" ' + (t ? 'style="color:' + t.accent + ';"' : '') + '>→</span>' +
        '</div>' +
      '</div>';
  }

  /* ── sign-in (logged-out view) ── */
  function signIn() {
    try {
      if (window.sb) {
        window.sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href }
        });
      }
    } catch (e) { console.error('[profile] signIn', e); }
  }

  function root() { return document.getElementById('profile-root'); }

  function renderSignedOut() {
    var el = root();
    if (!el) return;
    el.innerHTML =
      '<div class="pf-signin">' +
        '<h1 class="pf-signin-title">Sign in to view your profile</h1>' +
        '<p class="pf-signin-sub">Your saved festivals and personal rave calendar live here. Sign in to pick up where you left off.</p>' +
        '<button type="button" class="gsi-btn" id="pf-signin-btn">' + GOOGLE_G_SVG + '<span>Sign in with Google</span></button>' +
      '</div>';
    var btn = document.getElementById('pf-signin-btn');
    if (btn) btn.addEventListener('click', signIn);
  }

  /* ── signed-in shell: header + sidebar + content ── */
  function renderSignedIn(session) {
    var el = root();
    if (!el) return;
    var u = session.user;
    var meta = u.user_metadata || {};
    var name = meta.full_name || meta.name || u.email || 'Raver';
    var email = u.email || '';
    var avatar = meta.avatar_url
      ? '<img class="pf-avatar" src="' + escapeHtml(meta.avatar_url) + '" alt="" referrerpolicy="no-referrer">'
      : '<span class="pf-avatar pf-avatar-default" aria-hidden="true">' + PERSON_SVG + '</span>';

    var sidebar = SECTIONS.map(function (s) {
      return '<button type="button" class="pf-nav-item' + (s.id === _activeSection ? ' active' : '') + '" data-section="' + s.id + '">' +
        '<span class="pf-nav-icon">' + s.icon + '</span>' + s.label + '</button>';
    }).join('');

    el.innerHTML =
      '<header class="pf-header">' +
        avatar +
        '<div class="pf-id">' +
          '<h1 class="pf-name">' + escapeHtml(name) + '</h1>' +
          (email ? '<p class="pf-email">' + escapeHtml(email) + '</p>' : '') +
        '</div>' +
      '</header>' +
      '<div class="pf-layout">' +
        '<aside class="pf-sidebar">' + sidebar + '</aside>' +
        '<section class="pf-content" id="pf-content"></section>' +
      '</div>';

    var items = el.querySelectorAll('.pf-nav-item');
    Array.prototype.forEach.call(items, function (btn) {
      btn.addEventListener('click', function () {
        selectSection(btn.getAttribute('data-section'));
      });
    });

    renderSection();
  }

  function selectSection(id) {
    if (!id || id === _activeSection) return;
    _activeSection = id;
    var items = document.querySelectorAll('.pf-nav-item');
    Array.prototype.forEach.call(items, function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-section') === id);
    });
    renderSection();
  }

  function renderSection() {
    var el = document.getElementById('pf-content');
    if (!el) return;
    if (_activeSection === 'account') {
      el.innerHTML =
        '<h2 class="pf-section-title">Account</h2>' +
        '<p class="pf-placeholder">Account settings are coming soon. For now, use “Sign out” in the top nav to switch accounts.</p>';
      return;
    }
    renderRaveCalendar(el);
  }

  /* ── Rave Calendar: saved UPCOMING festivals ── */
  function renderRaveCalendar(el) {
    el.innerHTML =
      '<h2 class="pf-section-title">Rave Calendar</h2>' +
      '<p class="pf-section-sub">Your saved upcoming festivals, sorted by date.</p>' +
      '<div id="pf-cal-grid" class="pf-fest-grid"><p class="pf-loading">Loading your rave calendar…</p></div>';

    (async function () {
      var savedIds = [];
      try {
        var sb = window.sb;
        if (sb) {
          var res = await sb.auth.getSession();
          var session = (res && res.data) ? res.data.session : null;
          if (session && session.user) {
            var q = await sb.from('saved_festivals').select('festival_id');
            if (q.error) throw q.error;
            savedIds = (q.data || []).map(function (r) { return r.festival_id; });
          }
        }
      } catch (e) {
        console.error('[profile] loadSavedFestivals', e);
      }

      var grid = document.getElementById('pf-cal-grid');
      if (!grid) return; // section changed while we were loading

      var all = (window.PLURGASM_DATA && window.PLURGASM_DATA.festivals) || [];
      var set = {};
      savedIds.forEach(function (id) { set[String(id)] = true; });

      var list = all.filter(function (f) {
        return set[String(f.id)] && !isPast(f);
      }).sort(function (a, b) {
        return String(a.sortDate || '').localeCompare(String(b.sortDate || ''));
      });

      if (!list.length) {
        grid.className = '';
        grid.innerHTML =
          '<div class="pf-empty">' +
            '<p class="pf-empty-emoji">🤍</p>' +
            '<p class="pf-empty-text">Save festivals with the heart to build your rave calendar</p>' +
            '<a class="pf-empty-cta" href="/calendar">Browse the calendar →</a>' +
          '</div>';
        return;
      }

      grid.className = 'pf-fest-grid';
      grid.innerHTML = list.map(festCardHTML).join('');
      if (window.PlurSaves) PlurSaves.markAll();
    })();
  }

  function renderProfile() {
    if (_session && _session.user) renderSignedIn(_session);
    else renderSignedOut();
  }

  /* ── boot: watch auth (window.sb created by auth.js, may init after us) ── */
  function watchAuth(tries) {
    tries = tries || 0;
    if (!window.sb) {
      if (tries < 100) { setTimeout(function () { watchAuth(tries + 1); }, 50); return; }
      renderSignedOut(); // Supabase never loaded — show the sign-in prompt
      return;
    }
    try {
      window.sb.auth.getSession()
        .then(function (res) {
          _session = (res && res.data) ? res.data.session : null;
          renderProfile();
        })
        .catch(function (e) { console.error('[profile] getSession', e); renderProfile(); });

      window.sb.auth.onAuthStateChange(function (_event, session) {
        _session = session;
        renderProfile();
      });
    } catch (e) {
      console.error('[profile] watchAuth', e);
      renderProfile();
    }
  }

  function start() {
    watchAuth(0);
    // When a heart is toggled (here or elsewhere), refresh the Rave Calendar so
    // an un-saved festival drops off the list immediately.
    document.addEventListener('plur:saves-changed', function () {
      if (_session && _session.user && _activeSection === 'rave-calendar') {
        var el = document.getElementById('pf-content');
        if (el) renderRaveCalendar(el);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
