<style>
/* ─────── PROFILE PAGE ─────── */
.pf-wrap { max-width: 1180px; margin: 0 auto; padding: 110px 32px 90px; }

/* loading + signed-out */
.pf-loading-screen,
.pf-signin {
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
}
.pf-loading-screen p {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.pf-signin-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 6vw, 58px);
  letter-spacing: 3px;
  color: var(--white);
  line-height: 1;
}
.pf-signin-sub {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 420px;
  margin-top: -6px;
}

/* header */
.pf-header {
  display: flex;
  align-items: center;
  gap: 22px;
  padding-bottom: 28px;
  margin-bottom: 34px;
  border-bottom: 1px solid var(--border);
}
.pf-avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(0,229,255,0.4);
  box-shadow: 0 0 0 4px rgba(0,229,255,0.06);
  flex: 0 0 auto;
}
.pf-avatar-default {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(240,238,255,0.06);
  color: rgba(240,238,255,0.5);
}
.pf-avatar-default svg { width: 40px; height: 40px; display: block; }
.pf-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 4.6vw, 46px);
  letter-spacing: 2px;
  color: var(--white);
  line-height: 1;
  margin-bottom: 8px;
}
.pf-email {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.5px;
  color: var(--muted);
  word-break: break-all;
}

/* layout: sidebar + content */
.pf-layout {
  display: grid;
  grid-template-columns: 244px 1fr;
  gap: 36px;
  align-items: start;
}
.pf-sidebar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 100px;
}
.pf-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  background: transparent;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  color: var(--muted);
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.pf-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--white); }
.pf-nav-item.active {
  background: rgba(0,229,255,0.06);
  border-color: rgba(0,229,255,0.22);
  border-left-color: var(--cyan);
  color: var(--white);
}
.pf-nav-icon { font-size: 16px; line-height: 1; }

/* content sections */
.pf-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 2px;
  color: var(--white);
  margin-bottom: 6px;
}
.pf-section-sub {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
}
.pf-fest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}
.pf-loading {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--muted);
  grid-column: 1 / -1;
  padding: 24px 0;
}

/* empty state */
.pf-empty {
  text-align: center;
  padding: 64px 24px;
  border: 1px dashed var(--border);
  background: rgba(255,255,255,0.015);
}
.pf-empty-emoji { font-size: 40px; margin-bottom: 14px; }
.pf-empty-text {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 380px;
  margin: 0 auto 20px;
}
.pf-empty-cta {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--cyan);
  border: 1px solid rgba(0,229,255,0.3);
  padding: 10px 18px;
  text-decoration: none;
  display: inline-block;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
}
.pf-empty-cta:hover { color: #06060c; background: var(--cyan); border-color: var(--cyan); }

.pf-placeholder {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 520px;
}

/* ─────── RAVE CALENDAR — month grid ─────── */
.pf-cal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.pf-cal-title {
  flex: 1;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
  color: var(--white);
  line-height: 1;
}
.pf-cal-btn {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  padding: 8px 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.pf-cal-btn:hover {
  color: var(--cyan);
  border-color: rgba(0,229,255,0.4);
  background: rgba(0,229,255,0.05);
}
.pf-cal-nav { font-size: 18px; line-height: 1; padding: 4px 12px; }
.pf-cal-weekdays,
.pf-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.pf-cal-weekdays { margin-bottom: 6px; }
.pf-cal-weekday {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  padding: 4px 0;
}
.pf-cal-cell {
  min-height: 98px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.015);
  border-radius: 5px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}
.pf-cal-cell.blank { background: transparent; border-color: transparent; }
.pf-cal-cell.has-fest { cursor: pointer; }
.pf-cal-cell.today {
  border-color: rgba(0,229,255,0.5);
  box-shadow: inset 0 0 0 1px rgba(0,229,255,0.25);
}
.pf-cal-cell.selected { border-color: rgba(0,229,255,0.6); background: rgba(0,229,255,0.05); }
.pf-cal-daynum {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
.pf-cal-cell.today .pf-cal-daynum { color: var(--cyan); font-weight: 500; }
.pf-cal-pills { display: flex; flex-direction: column; gap: 3px; }
.pf-cal-pill {
  display: block;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.3;
  padding: 2px 6px;
  border-radius: 3px;
  border-left: 2px solid;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf-cal-pill:hover { filter: brightness(1.25); }
.pf-cal-dots { display: none; flex-wrap: wrap; gap: 3px; }
.pf-cal-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }

/* day panel — mobile tap-to-expand (and desktop click) */
.pf-cal-daypanel { margin-top: 16px; }
.pf-cal-daypanel:empty { display: none; }
.pf-cal-daypanel-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  border-radius: 5px;
  padding: 14px 16px;
}
.pf-cal-daypanel-head {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 10px;
}
.pf-cal-daypanel-empty { font-family: 'Chakra Petch', sans-serif; font-size: 14px; color: var(--muted); }
.pf-cal-daypanel-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  text-decoration: none;
  border-top: 1px solid var(--border);
}
.pf-cal-daypanel-row:first-of-type { border-top: none; }
.pf-cal-daypanel-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.pf-cal-daypanel-name { font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; color: var(--white); }
.pf-cal-daypanel-loc {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 13px;
  color: var(--muted);
  margin-left: auto;
  text-align: right;
}

/* agenda — what's next */
.pf-cal-agenda { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 22px; }
.pf-cal-agenda-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 1.5px;
  color: var(--white);
  margin-bottom: 12px;
}
.pf-agenda-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 4px;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  transition: background 0.15s;
}
.pf-agenda-row:hover { background: rgba(255,255,255,0.03); }
.pf-agenda-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.pf-agenda-date {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.5px;
  color: var(--muted);
  flex: 0 0 auto;
  min-width: 150px;
}
.pf-agenda-name {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--white);
}

/* Remove control on saved-festival rows (agenda + day panel). A small ✕ that
   deletes the festival from the user's saved list. Pushed to the row's right. */
.pf-remove-btn {
  margin-left: auto;
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.pf-remove-btn:hover,
.pf-remove-btn:focus-visible {
  color: var(--pink, #ff2d78);
  border-color: rgba(255,45,120,0.55);
  background: rgba(255,45,120,0.1);
  outline: none;
}
/* In the day panel the location already claims margin-left:auto, so the button
   sits just after it rather than spanning the row. */
.pf-cal-daypanel-loc + .pf-remove-btn { margin-left: 10px; }

@media (max-width: 820px) {
  .pf-wrap { padding: 96px 18px 80px; }
  .pf-layout { grid-template-columns: 1fr; gap: 24px; }
  .pf-sidebar {
    position: static;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pf-nav-item {
    width: auto;
    border-left: none;
    border: 1px solid transparent;
  }
  .pf-nav-item.active { border-color: rgba(0,229,255,0.25); border-left: none; }
}
@media (max-width: 480px) {
  .pf-fest-grid { grid-template-columns: 1fr; }
  .pf-header { gap: 16px; }
  .pf-avatar { width: 64px; height: 64px; }
  .pf-avatar-default svg { width: 30px; height: 30px; }
}

/* mobile calendar: shrink cells, swap full pills for dots, keep agenda prominent */
@media (max-width: 560px) {
  .pf-cal-weekdays, .pf-cal-grid { gap: 3px; }
  .pf-cal-cell { min-height: 46px; padding: 4px 3px; border-radius: 4px; gap: 3px; }
  .pf-cal-pills { display: none; }
  .pf-cal-cell.has-fest .pf-cal-dots { display: flex; }
  .pf-cal-daynum { font-size: 11px; }
  .pf-cal-weekday { font-size: 9px; letter-spacing: 0; }
  .pf-cal-title { font-size: 22px; }
  .pf-cal-btn { padding: 7px 9px; font-size: 11px; }
  .pf-cal-nav { padding: 4px 9px; }
  .pf-agenda-row { flex-wrap: wrap; }
  .pf-agenda-date { min-width: 0; flex-basis: 100%; order: 2; margin-left: 21px; }
  .pf-agenda-name { flex-basis: calc(100% - 21px); }
}
</style>
</head>

<script src="js/data.js"></script>
<script>
/* ════════════════════════════════════════════════
   PROFILE PAGE
   Logged out  → "Sign in to view your profile" + Google button.
   Logged in   → header (avatar/name/email) + sidebar + active section.
   "Rave Calendar" (default) shows the user's saved UPCOMING festivals as
   festival cards, read from Supabase (RLS scopes to their own rows).
   Every Supabase call is wrapped in try/catch w/ console.error so a hiccup
   never blanks the page.
════════════════════════════════════════════════ */
(function () {
  'use strict';

  var TODAY = new Date().toISOString().slice(0, 10);
  function isPast(f) { return (f.endDate || f.sortDate) < TODAY; }

  var _session = null;
  var _activeSection = 'rave-calendar';

  var SECTIONS = [
    { id: 'rave-calendar', label: 'Rave Calendar', icon: '🗓' },
    { id: 'account',       label: 'Account',       icon: '⚙' }
  ];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var GOOGLE_G_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">' +
      '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
      '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
      '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
      '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
    '</svg>';

  var PERSON_SVG =
    '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" focusable="false">' +
      '<path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.42 0-8 2.69-8 6v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-3.31-3.58-6-8-6z"/>' +
    '</svg>';

  /* ── festival detail href — extensionless internal URL (mirrors main.js) ── */
  function festDetailHref(f) {
    if (!f.detailPage) return f.url;
    return '/' + f.detailPage.replace(/^\/+/, '').replace(/\.html$/, '');
  }

  /* ── sign-in (logged-out view) ── */
  function signIn() {
    try {
      if (window.sb) {
        window.sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href }
        });
      }
    } catch (e) { console.error('[profile] signIn', e); }
  }

  function root() { return document.getElementById('profile-root'); }

  function renderSignedOut() {
    var el = root();
    if (!el) return;
    el.innerHTML =
      '<div class="pf-signin">' +
        '<h1 class="pf-signin-title">Sign in to view your profile</h1>' +
        '<p class="pf-signin-sub">Your saved festivals and personal rave calendar live here. Sign in to pick up where you left off.</p>' +
        '<button type="button" class="gsi-btn" id="pf-signin-btn">' + GOOGLE_G_SVG + '<span>Sign in with Google</span></button>' +
      '</div>';
    var btn = document.getElementById('pf-signin-btn');
    if (btn) btn.addEventListener('click', signIn);
  }

  /* ── signed-in shell: header + sidebar + content ── */
  function renderSignedIn(session) {
    var el = root();
    if (!el) return;
    var u = session.user;
    var meta = u.user_metadata || {};
    var name = meta.full_name || meta.name || u.email || 'Raver';
    var email = u.email || '';
    var avatar = meta.avatar_url
      ? '<img class="pf-avatar" src="' + escapeHtml(meta.avatar_url) + '" alt="" referrerpolicy="no-referrer">'
      : '<span class="pf-avatar pf-avatar-default" aria-hidden="true">' + PERSON_SVG + '</span>';

    var sidebar = SECTIONS.map(function (s) {
      return '<button type="button" class="pf-nav-item' + (s.id === _activeSection ? ' active' : '') + '" data-section="' + s.id + '">' +
        '<span class="pf-nav-icon">' + s.icon + '</span>' + s.label + '</button>';
    }).join('');

    el.innerHTML =
      '<header class="pf-header">' +
        avatar +
        '<div class="pf-id">' +
          '<h1 class="pf-name">' + escapeHtml(name) + '</h1>' +
          (email ? '<p class="pf-email">' + escapeHtml(email) + '</p>' : '') +
        '</div>' +
      '</header>' +
      '<div class="pf-layout">' +
        '<aside class="pf-sidebar">' + sidebar + '</aside>' +
        '<section class="pf-content" id="pf-content"></section>' +
      '</div>';

    var items = el.querySelectorAll('.pf-nav-item');
    Array.prototype.forEach.call(items, function (btn) {
      btn.addEventListener('click', function () {
        selectSection(btn.getAttribute('data-section'));
      });
    });

    renderSection();
  }

  function selectSection(id) {
    if (!id || id === _activeSection) return;
    _activeSection = id;
    var items = document.querySelectorAll('.pf-nav-item');
    Array.prototype.forEach.call(items, function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-section') === id);
    });
    renderSection();
  }

  function renderSection() {
    var el = document.getElementById('pf-content');
    if (!el) return;
    if (_activeSection === 'account') {
      el.innerHTML =
        '<h2 class="pf-section-title">Account</h2>' +
        '<p class="pf-placeholder">Account settings are coming soon. For now, use “Sign out” in the top nav to switch accounts.</p>';
      return;
    }
    renderRaveCalendar(el);
  }

  /* ── Rave Calendar: month-grid of saved UPCOMING festivals ── */
  var CAL_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
  var CAL_DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  /* brand neon accents — one per festival so they're distinguishable on the grid */
  var CAL_COLORS = [
    { accent: '#00e5ff', bg: 'rgba(0,229,255,0.13)',  border: 'rgba(0,229,255,0.55)',  text: '#9defff' },
    { accent: '#ff2d78', bg: 'rgba(255,45,120,0.13)', border: 'rgba(255,45,120,0.55)', text: '#ff9bc0' },
    { accent: '#b64dff', bg: 'rgba(182,77,255,0.13)', border: 'rgba(182,77,255,0.55)', text: '#d6a8ff' },
    { accent: '#3dff85', bg: 'rgba(61,255,133,0.13)', border: 'rgba(61,255,133,0.55)', text: '#a6ffc8' },
    { accent: '#ffb800', bg: 'rgba(255,184,0,0.13)',  border: 'rgba(255,184,0,0.55)',  text: '#ffd97a' }
  ];

  var _calList = [];   // saved upcoming festivals, sorted by sortDate
  var _calColor = {};  // festival id -> color object
  var _calYear = 0;
  var _calMonth = 0;   // 0-based

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayStr(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); } // m is 0-based

  // festivals active on a given YYYY-MM-DD (string compare is safe for ISO dates)
  function festsOnDay(ds) {
    return _calList.filter(function (f) {
      var s = f.sortDate, e = f.endDate || f.sortDate;
      return s && s <= ds && ds <= e;
    });
  }

  // does any saved festival touch the given month?
  function monthHasFests(y, m) {
    var first = dayStr(y, m, 1);
    var last = dayStr(y, m, new Date(y, m + 1, 0).getDate());
    return _calList.some(function (f) {
      var s = f.sortDate, e = f.endDate || f.sortDate;
      return s && s <= last && e >= first;
    });
  }

  function festHref(f) { return festDetailHref(f); }
  function festTarget(f) { return f.detailPage ? '_self' : '_blank'; }

  function renderRaveCalendar(el) {
    el.innerHTML =
      '<h2 class="pf-section-title">Rave Calendar</h2>' +
      '<p class="pf-section-sub">Your saved upcoming festivals, blocked out on the days they run.</p>' +
      '<div id="pf-cal-root"><p class="pf-loading">Loading your rave calendar…</p></div>';

    (async function () {
      var savedIds = [];
      try {
        var sb = window.sb;
        if (sb) {
          var res = await sb.auth.getSession();
          var session = (res && res.data) ? res.data.session : null;
          if (session && session.user) {
            var q = await sb.from('saved_festivals').select('festival_id');
            if (q.error) throw q.error;
            savedIds = (q.data || []).map(function (r) { return r.festival_id; });
          }
        }
      } catch (e) {
        console.error('[profile] loadSavedFestivals', e);
      }

      var rootEl = document.getElementById('pf-cal-root');
      if (!rootEl) return; // section changed while we were loading

      try {
        var all = (window.PLURGASM_DATA && window.PLURGASM_DATA.festivals) || [];
        var set = {};
        savedIds.forEach(function (id) { set[String(id)] = true; });

        _calList = all.filter(function (f) {
          return set[String(f.id)] && !isPast(f);
        }).sort(function (a, b) {
          return String(a.sortDate || '').localeCompare(String(b.sortDate || ''));
        });

        if (!_calList.length) {
          rootEl.innerHTML =
            '<div class="pf-empty">' +
              '<p class="pf-empty-emoji">🤍</p>' +
              '<p class="pf-empty-text">Add festivals from the calendar to build your rave calendar</p>' +
              '<a class="pf-empty-cta" href="/calendar">Browse the calendar →</a>' +
            '</div>';
          return;
        }

        // assign a stable brand color to each festival (by sorted order)
        _calColor = {};
        _calList.forEach(function (f, i) { _calColor[String(f.id)] = CAL_COLORS[i % CAL_COLORS.length]; });

        // default month: current month, else the earliest saved festival's month
        var now = new Date();
        if (monthHasFests(now.getFullYear(), now.getMonth())) {
          _calYear = now.getFullYear();
          _calMonth = now.getMonth();
        } else {
          var p = String(_calList[0].sortDate).split('-');
          _calYear = parseInt(p[0], 10);
          _calMonth = parseInt(p[1], 10) - 1;
        }

        mountCalendar(rootEl);
      } catch (e) {
        console.error('[profile] renderRaveCalendar', e);
        rootEl.innerHTML = '<p class="pf-loading">Couldn\'t load your calendar. Please refresh.</p>';
      }
    })();
  }

  function mountCalendar(rootEl) {
    rootEl.innerHTML =
      '<div class="pf-cal">' +
        '<div class="pf-cal-head">' +
          '<button type="button" class="pf-cal-btn pf-cal-nav" data-cal="prev" aria-label="Previous month">‹</button>' +
          '<div class="pf-cal-title" id="pf-cal-title"></div>' +
          '<button type="button" class="pf-cal-btn" data-cal="today">Today</button>' +
          '<button type="button" class="pf-cal-btn pf-cal-nav" data-cal="next" aria-label="Next month">›</button>' +
        '</div>' +
        '<div class="pf-cal-weekdays">' +
          CAL_DOW.map(function (d) { return '<div class="pf-cal-weekday">' + d + '</div>'; }).join('') +
        '</div>' +
        '<div class="pf-cal-grid" id="pf-cal-grid"></div>' +
        '<div class="pf-cal-daypanel" id="pf-cal-daypanel"></div>' +
        '<div class="pf-cal-agenda">' +
          '<h3 class="pf-cal-agenda-title">What\'s next</h3>' +
          '<div class="pf-cal-agenda-list">' + agendaHTML() + '</div>' +
        '</div>' +
      '</div>';

    var navBtns = rootEl.querySelectorAll('[data-cal]');
    Array.prototype.forEach.call(navBtns, function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-cal');
        if (act === 'prev') stepMonth(-1);
        else if (act === 'next') stepMonth(1);
        else if (act === 'today') {
          var n = new Date();
          _calYear = n.getFullYear();
          _calMonth = n.getMonth();
          drawMonth();
        }
      });
    });

    drawMonth();
  }

  function stepMonth(delta) {
    _calMonth += delta;
    if (_calMonth < 0) { _calMonth = 11; _calYear--; }
    else if (_calMonth > 11) { _calMonth = 0; _calYear++; }
    drawMonth();
  }

  function drawMonth() {
    var title = document.getElementById('pf-cal-title');
    var grid = document.getElementById('pf-cal-grid');
    var panel = document.getElementById('pf-cal-daypanel');
    if (!title || !grid) return;
    title.textContent = CAL_MONTHS[_calMonth] + ' ' + _calYear;
    if (panel) panel.innerHTML = '';
    grid.innerHTML = gridHTML();

    var cells = grid.querySelectorAll('.pf-cal-cell.has-fest');
    Array.prototype.forEach.call(cells, function (c) {
      c.addEventListener('click', function (ev) {
        if (ev.target.closest('a')) return; // let pill links navigate
        selectDay(c.getAttribute('data-day'), c);
      });
    });
  }

  function gridHTML() {
    var firstDow = new Date(_calYear, _calMonth, 1).getDay();
    var daysIn = new Date(_calYear, _calMonth + 1, 0).getDate();
    var cells = [];
    var i;
    for (i = 0; i < firstDow; i++) cells.push('<div class="pf-cal-cell blank"></div>');
    for (var d = 1; d <= daysIn; d++) {
      var ds = dayStr(_calYear, _calMonth, d);
      var fests = festsOnDay(ds);
      var isToday = ds === TODAY;
      var cls = 'pf-cal-cell' + (isToday ? ' today' : '') + (fests.length ? ' has-fest' : '');
      var pills = fests.map(function (f) {
        var c = _calColor[String(f.id)] || CAL_COLORS[0];
        return '<a class="pf-cal-pill" href="' + festHref(f) + '" target="' + festTarget(f) + '"' +
          (f.detailPage ? '' : ' rel="noopener"') +
          ' style="background:' + c.bg + ';border-left-color:' + c.border + ';color:' + c.text + ';"' +
          ' onclick="event.stopPropagation()" title="' + escapeHtml(f.name) + '">' + escapeHtml(f.name) + '</a>';
      }).join('');
      var dots = fests.map(function (f) {
        var c = _calColor[String(f.id)] || CAL_COLORS[0];
        return '<span class="pf-cal-dot" style="background:' + c.accent + ';"></span>';
      }).join('');
      cells.push(
        '<div class="' + cls + '" data-day="' + ds + '">' +
          '<span class="pf-cal-daynum">' + d + '</span>' +
          (fests.length ? '<div class="pf-cal-dots">' + dots + '</div>' : '') +
          (fests.length ? '<div class="pf-cal-pills">' + pills + '</div>' : '') +
        '</div>');
    }
    while (cells.length % 7 !== 0) cells.push('<div class="pf-cal-cell blank"></div>');
    return cells.join('');
  }

  function selectDay(ds, cell) {
    var panel = document.getElementById('pf-cal-daypanel');
    if (!panel) return;
    var grid = document.getElementById('pf-cal-grid');
    if (grid) {
      var sel = grid.querySelectorAll('.pf-cal-cell.selected');
      Array.prototype.forEach.call(sel, function (c) { c.classList.remove('selected'); });
    }
    if (cell) cell.classList.add('selected');

    var fests = festsOnDay(ds);
    var p = ds.split('-');
    var dObj = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    var heading = CAL_DOW[dObj.getDay()] + ', ' + CAL_MONTHS[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10);

    if (!fests.length) {
      panel.innerHTML =
        '<div class="pf-cal-daypanel-card">' +
          '<p class="pf-cal-daypanel-head">' + heading + '</p>' +
          '<p class="pf-cal-daypanel-empty">No festivals this day.</p>' +
        '</div>';
      return;
    }
    panel.innerHTML =
      '<div class="pf-cal-daypanel-card">' +
        '<p class="pf-cal-daypanel-head">' + heading + '</p>' +
        fests.map(function (f) {
          var c = _calColor[String(f.id)] || CAL_COLORS[0];
          return '<a class="pf-cal-daypanel-row" href="' + festHref(f) + '" target="' + festTarget(f) + '"' +
            (f.detailPage ? '' : ' rel="noopener"') + '>' +
            '<span class="pf-cal-daypanel-dot" style="background:' + c.accent + ';"></span>' +
            '<span class="pf-cal-daypanel-name">' + escapeHtml(f.name) + '</span>' +
            '<span class="pf-cal-daypanel-loc">' + escapeHtml(f.location || '') + '</span>' +
            removeBtnHtml(f) +
          '</a>';
        }).join('') +
      '</div>';
  }

  // Small ✕ that removes a festival from the user's saved list. A role="button"
  // span (not a <button>) so it's valid markup inside the anchor rows it lives
  // in; the delegated handler in start() wires click + keyboard.
  function removeBtnHtml(f) {
    return '<span class="pf-remove-btn" role="button" tabindex="0"' +
      ' data-remove-id="' + escapeHtml(String(f.id)) + '"' +
      ' aria-label="Remove ' + escapeHtml(f.name) + ' from your saved festivals"' +
      ' title="Remove from saved">✕</span>';
  }

  // Day-level countdown badge for a saved festival, computed once on render.
  // Parses ISO parts by hand (NOT new Date(iso)) to avoid the UTC off-by-one,
  // and is wrapped in try/catch so a malformed date can never break the row or
  // the surrounding calendar render — it just yields no badge.
  function countdownHtml(f) {
    try {
      if (!f || !f.sortDate) return '';
      var sp = String(f.sortDate).split('-').map(Number);
      var start = new Date(sp[0], sp[1] - 1, sp[2]);
      var ep = String(f.endDate || f.sortDate).split('-').map(Number);
      var end = new Date(ep[0], ep[1] - 1, ep[2]);
      var today = new Date();
      today.setHours(0, 0, 0, 0);

      if (today < start) {
        var days = Math.round((start - today) / 86400000);
        var label = days === 1 ? 'TOMORROW' : days + ' DAYS TO GO';
        return '<span class="fest-countdown">' + label + '</span>';
      }
      if (today <= end) {
        return '<span class="fest-countdown is-live">HAPPENING NOW</span>';
      }
      return '<span class="fest-countdown is-over">ENDED</span>';
    } catch (e) {
      console.error('[profile] countdownHtml', e);
      return '';
    }
  }

  function agendaHTML() {
    return _calList.map(function (f) {
      var c = _calColor[String(f.id)] || CAL_COLORS[0];
      return '<a class="pf-agenda-row" href="' + festHref(f) + '" target="' + festTarget(f) + '"' +
        (f.detailPage ? '' : ' rel="noopener"') + '>' +
        '<span class="pf-agenda-dot" style="background:' + c.accent + ';"></span>' +
        '<span class="pf-agenda-date">' + escapeHtml(f.dates || '') + '</span>' +
        '<span class="pf-agenda-name">' + escapeHtml(f.name) + '</span>' +
        countdownHtml(f) +
        removeBtnHtml(f) +
      '</a>';
    }).join('');
  }

  // Delete a saved festival (user_id + festival_id), then re-render the agenda +
  // month grid in place so it disappears immediately — without a full reload, so
  // the current month and any selected day are preserved.
  function pfRemoveSaved(festId) {
    var id = String(festId);
    (async function () {
      try {
        var sb = window.sb;
        if (!sb) return;
        var res = await sb.auth.getSession();
        var session = (res && res.data) ? res.data.session : null;
        if (!session || !session.user) return;

        var del = await sb.from('saved_festivals').delete()
          .eq('user_id', session.user.id)
          .eq('festival_id', id);
        if (del.error) throw del.error;

        _calList = _calList.filter(function (f) { return String(f.id) !== id; });
        delete _calColor[id];

        var rootEl = document.getElementById('pf-cal-root');
        if (!rootEl) return;
        if (!_calList.length) {
          rootEl.innerHTML =
            '<div class="pf-empty">' +
              '<p class="pf-empty-emoji">🤍</p>' +
              '<p class="pf-empty-text">No saved festivals yet — add some from the calendar</p>' +
              '<a class="pf-empty-cta" href="/calendar">Browse the calendar →</a>' +
            '</div>';
          return;
        }
        var agendaList = rootEl.querySelector('.pf-cal-agenda-list');
        if (agendaList) agendaList.innerHTML = agendaHTML();
        drawMonth(); // redraw current month's grid + clear the day panel
      } catch (e) {
        console.error('[profile] pfRemoveSaved', e);
      }
    })();
  }

  function renderProfile() {
    if (_session && _session.user) renderSignedIn(_session);
    else renderSignedOut();
  }

  /* ── boot: watch auth (window.sb created by auth.js, may init after us) ── */
  function watchAuth(tries) {
    tries = tries || 0;
    if (!window.sb) {
      if (tries < 100) { setTimeout(function () { watchAuth(tries + 1); }, 50); return; }
      renderSignedOut(); // Supabase never loaded — show the sign-in prompt
      return;
    }
    try {
      window.sb.auth.getSession()
        .then(function (res) {
          _session = (res && res.data) ? res.data.session : null;
          renderProfile();
        })
        .catch(function (e) { console.error('[profile] getSession', e); renderProfile(); });

      window.sb.auth.onAuthStateChange(function (_event, session) {
        _session = session;
        renderProfile();
      });
    } catch (e) {
      console.error('[profile] watchAuth', e);
      renderProfile();
    }
  }

  function start() {
    watchAuth(0);
    // When a save is toggled elsewhere, refresh the Rave Calendar so an un-saved
    // festival drops off the list immediately.
    document.addEventListener('plur:saves-changed', function () {
      if (_session && _session.user && _activeSection === 'rave-calendar') {
        var el = document.getElementById('pf-content');
        if (el) renderRaveCalendar(el);
      }
    });

    // Delegated (capture-phase) handlers for the per-festival Remove control.
    // stopPropagation keeps the click/keypress from triggering the surrounding
    // anchor row's navigation.
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.pf-remove-btn') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      var id = btn.getAttribute('data-remove-id');
      if (id) pfRemoveSaved(id);
    }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var btn = e.target && e.target.closest ? e.target.closest('.pf-remove-btn') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      var id = btn.getAttribute('data-remove-id');
      if (id) pfRemoveSaved(id);
    }, true);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
