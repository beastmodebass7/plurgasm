<script src="js/data.js" defer></script>
<script>
function toggleMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  const btn  = document.getElementById('hamburger');
  const opening = !menu.classList.contains('open');
  menu.classList.toggle('open', opening);
  btn.classList.toggle('open', opening);
  btn.setAttribute('aria-expanded', opening);
  document.body.style.overflow = opening ? 'hidden' : '';
}
function closeMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  const btn  = document.getElementById('hamburger');
  menu.classList.remove('open');
  btn.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileMenu(); });

(function() {
  const bar = document.getElementById('scroll-progress');
  if (!bar) return;
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY;
    const total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (total > 0 ? (scrolled / total) * 100 : 0) + '%';
  }, { passive: true });
})();

const catColors = {
  'festival-news': 'var(--cyan)',
  'culture':       'var(--purple)',
  'fashion':       'var(--pink)',
  'safety':        'var(--green)',
  'gear':          'var(--amber)',
};
const catLabels = {
  'festival-news': 'Festival News',
  'culture':       'Culture',
  'fashion':       'Fashion',
  'safety':        'Safety',
  'gear':          'Gear',
};

function getColor(cat) { return catColors[cat] || 'var(--cyan)'; }
function getLabel(cat) { return catLabels[cat] || cat; }
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}
function setCanonical(url) {
  let l = document.querySelector('link[rel="canonical"]');
  if (!l) { l = document.createElement('link'); l.setAttribute('rel', 'canonical'); document.head.appendChild(l); }
  l.setAttribute('href', url);
}
function clampDesc(txt) {
  txt = (txt || '').replace(/\s+/g, ' ').trim();
  if (txt.length > 160) {
    txt = txt.slice(0, 160);
    const sp = txt.lastIndexOf(' ');
    if (sp > 120) txt = txt.slice(0, sp);
    txt = txt.replace(/[\s.,;:!?-]+$/, '') + '…';
  }
  return txt;
}
function setMetaDesc(txt) {
  let m = document.querySelector('meta[name="description"]');
  if (!m) { m = document.createElement('meta'); m.setAttribute('name', 'description'); document.head.appendChild(m); }
  m.setAttribute('content', clampDesc(txt));
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const posts = (PLURGASM_DATA.blogPosts || []).filter(p => p.published);
  const post = posts.find(p => p.id === id);
  const main = document.getElementById('post-main');

  if (!post) {
    main.innerHTML = `
      <div style="text-align:center;padding:80px 0;">
        <p style="font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--white);">POST NOT FOUND</p>
        <p style="color:var(--muted);margin:16px 0 32px;">This post doesn't exist or has been removed.</p>
        <a href="/blog" class="nav-cta">← Back to Blog</a>
      </div>`;
    document.getElementById('more-section').style.display = 'none';
    return;
  }

  document.title = post.title + ' — PLURGASM';
  setCanonical('https://plurgasm.com/blog-post?id=' + post.id);
  const excerpt = (post.excerpt || '').trim();
  setMetaDesc(excerpt.length >= 25 ? excerpt : (post.title + ' — rave culture, news and guides on PLURGASM.'));

  const color = getColor(post.category);
  const label = getLabel(post.category);

  main.innerHTML = `
    <div style="margin-bottom:32px;">
      <a href="/blog" style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);transition:color 0.2s;"
        onmouseover="this.style.color='var(--cyan)'" onmouseout="this.style.color='var(--muted)'">← All Posts</a>
    </div>

    ${post.coverImage
      ? `<div style="width:100%;height:320px;overflow:hidden;margin-bottom:36px;">
           <img src="${post.coverImage}" alt="${post.title}" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover;">
         </div>`
      : `<div style="width:100%;height:200px;background:linear-gradient(135deg,${color}12,transparent);border:1px solid ${color}22;display:flex;align-items:center;justify-content:center;margin-bottom:36px;">
           <span style="font-family:'Bebas Neue',sans-serif;font-size:100px;color:${color};opacity:0.12;">${post.title[0]}</span>
         </div>`}

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
      <span class="blog-cat" style="color:${color};border-color:${color}44;">${label}</span>
      <span class="blog-date">${fmtDate(post.date)}</span>
    </div>

    <h1 style="font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,72px);letter-spacing:3px;color:var(--white);line-height:1.05;margin-bottom:16px;">${post.title}</h1>

    <div style="display:flex;align-items:center;gap:10px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:40px;flex-wrap:wrap;">
      <span style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">By ${post.author}</span>
      ${post.authorHandle ? `<span style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--cyan);">${post.authorHandle}</span>` : ''}
      <span class="views-badge-slot" id="post-views-slot"></span>
      <button class="share-btn" onclick="sharePost()" style="margin-left:auto;">Share Article</button>
    </div>

    <div id="post-body" style="font-size:18px;color:#ececf2;line-height:1.75;">${post.body}</div>
  `;

  document.querySelectorAll('#post-body img').forEach(img => {
    img.onerror = () => img.style.display = 'none';
    img.loading = 'lazy';
  });

  // View counter — increment once per session, then show "<n> views".
  (async () => {
    if (!window.PlurViews) return;
    const count = await PlurViews.recordAndGet(post.id);
    const slot = document.getElementById('post-views-slot');
    if (slot && count !== null) slot.innerHTML = PlurViews.badgeHtml(count);
  })();

  const morePosts = posts
    .filter(p => p.id !== post.id)
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0, 2);

  if (!morePosts.length) {
    document.getElementById('more-section').style.display = 'none';
    return;
  }

  document.getElementById('more-posts-grid').innerHTML = morePosts.map(p => {
    const c = getColor(p.category);
    const l = getLabel(p.category);
    const d = new Date(p.date).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    return `
      <a class="blog-card" href="/blog-post?id=${p.id}">
        <div class="blog-card-top">
          ${p.coverImage
            ? `<img src="${p.coverImage}" alt="${p.title}" class="blog-cover">`
            : `<div class="blog-cover-placeholder" style="background:linear-gradient(135deg,${c}22,transparent);">
                <span style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:${c};opacity:0.2;">${l[0]}</span>
               </div>`}
        </div>
        <div class="blog-card-body">
          <div class="blog-card-meta">
            <span class="blog-cat" style="color:${c};border-color:${c}33;">${l}</span>
            <span class="blog-date">${d}</span>
            <span class="views-badge-slot" data-post-id="${p.id}"></span>
          </div>
          <h3 class="blog-title">${p.title}</h3>
          <p class="blog-excerpt">${p.excerpt}</p>
          <div class="blog-author">
            <span class="blog-author-name">By ${p.author}</span>
            ${p.authorHandle ? `<span class="blog-author-handle">${p.authorHandle}</span>` : ''}
          </div>
        </div>
      </a>`;
  }).join('');

  if (window.PlurViews) PlurViews.fillBadges(document.getElementById('more-posts-grid'));
});

function sharePost() {
  const title = document.querySelector('h1')?.textContent || document.title;
  const excerpt = document.getElementById('post-excerpt')?.textContent || '';
  if (navigator.share) {
    navigator.share({
      title: title + ' — PLURGASM',
      text: excerpt,
      url: window.location.href
    });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copied!');
  }
}
</script>
